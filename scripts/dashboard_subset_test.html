<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard Data Subset Test</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #0e0e1a; color: #e6e6f0; padding: 24px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .as-of { color: #8a8aa0; font-size: 13px; margin: 0 0 24px; }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
    .metric { background: #181828; border: 1px solid #252540; border-radius: 8px; padding: 14px; }
    .metric .lbl { color: #8a8aa0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
    .metric .val { font-size: 24px; font-weight: 600; margin: 4px 0; color: #00d4ff; }
    .metric .delta { font-size: 12px; }
    .delta.up { color: #4ade80; }
    .delta.down { color: #f87171; }
    .charts { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; margin-bottom: 24px; }
    .chart-card { background: #181828; border: 1px solid #252540; border-radius: 8px; padding: 14px; }
    .chart-title { color: #e6e6f0; font-size: 13px; font-weight: 600; margin: 0 0 8px; }
    .chart-body { height: 240px; }
    .notes { background: #181828; border: 1px solid #252540; border-radius: 8px; padding: 14px; }
    .notes h3 { margin: 0 0 8px; font-size: 13px; color: #00d4ff; }
    .notes p { margin: 6px 0; font-size: 13px; line-height: 1.5; color: #c8c8d8; }
    .status { padding: 8px 12px; background: #1e3a2e; color: #4ade80; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
    .status.err { background: #3a1e1e; color: #f87171; }
  </style>
</head>
<body>
  <div id="status" class="status">Loading data…</div>
  <h1 id="title">Executive Dashboard (subset test)</h1>
  <p class="as-of" id="asOf"></p>
  <div class="metrics" id="metrics"></div>
  <div class="charts" id="charts"></div>
  <div class="notes" id="notes"><h3>AI brief</h3></div>

  <script>
    // Use the locally downloaded subset (same origin)
    fetch('dashboard_assets/data/chatters.json', { cache: 'no-store' })
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(data => {
        const ok = document.getElementById('status');
        ok.textContent = '✓ Data loaded (' + JSON.stringify(data).length + ' bytes, ' + data.metrics.length + ' metrics, ' + data.charts.length + ' charts)';
        document.getElementById('title').textContent = data.title;
        document.getElementById('asOf').textContent = data.asOfLabel;

        // Render metrics
        const mDiv = document.getElementById('metrics');
        data.metrics.forEach(m => {
          const card = document.createElement('div');
          card.className = 'metric';
          const fmt = (v) => m.format === 'currency' ? '$' + (v/1e6).toFixed(1) + 'M' : v.toLocaleString();
          const momUp = (m.mom ?? 0) >= 0 === (m.positiveIsGood !== false);
          card.innerHTML =
            '<div class="lbl">' + m.label + '</div>' +
            '<div class="val">' + fmt(m.value) + '</div>' +
            '<div class="delta ' + (momUp ? 'up' : 'down') + '">' + (m.mom ?? 0).toFixed(1) + '% ' + (m.momLabel||'MoM') + '</div>';
          mDiv.appendChild(card);
        });

        // Render first 2 charts as subset
        const cDiv = document.getElementById('charts');
        data.charts.slice(0, 2).forEach(c => {
          const card = document.createElement('div');
          card.className = 'chart-card';
          card.innerHTML = '<div class="chart-title">' + c.title + '</div><div class="chart-body" id="chart_' + c.id + '"></div>';
          cDiv.appendChild(card);
          const el = document.getElementById('chart_' + c.id);
          const chart = echarts.init(el);
          // Simple render: pie for pie, line for everything else
          if (c.kind === 'pie') {
            chart.setOption({
              tooltip: {},
              series: [{
                type: 'pie',
                radius: '60%',
                data: c.categories.map((cat, i) => ({ name: cat, value: c.series[0].data[i] })),
                color: ['#0808ee', '#00d4ff', '#a78bfa', '#4ade80']
              }]
            });
          } else {
            chart.setOption({
              tooltip: { trigger: 'axis' },
              xAxis: { type: 'category', data: c.categories },
              yAxis: { type: 'value' },
              series: c.series.map(s => ({
                name: s.name, type: s.type === 'bar' ? 'bar' : 'line',
                data: s.data, smooth: !!s.smooth,
                color: s.color || '#00d4ff'
              }))
            });
          }
        });

        // Render notes
        const nDiv = document.getElementById('notes');
        (data.notes || []).forEach(n => {
          const p = document.createElement('p');
          p.textContent = n;
          nDiv.appendChild(p);
        });
      })
      .catch(err => {
        const ok = document.getElementById('status');
        ok.className = 'status err';
        ok.textContent = '✗ Failed: ' + err.message;
      });
  </script>
</body>
</html>
