const allNodes = (elementsData.nodes||[]).map(n => n.data || n);
const allEdges = (elementsData.edges||[]).map(e => e.data || e);
const typeColor = {table:'#6366f1',view:'#8b5cf6',proc:'#10b981',other:'#ef4444'};
const typeGlow = {table:'rgba(99,102,241,0.25)',view:'rgba(139,92,246,0.25)',proc:'rgba(16,185,129,0.25)',other:'rgba(239,68,68,0.25)'};
function normType(t){const s=String(t||'').toLowerCase();return['table','view','proc'].includes(s)?s:'other';}

// Spiral ring layout — O(n), instant (same algorithm as the original)
function buildPositions(nodes){
  const map = new Map();
  const step = 68;
  nodes.forEach((node, idx) => {
    const ring = Math.floor(Math.sqrt(idx));
    const ringStart = ring * ring;
    const ringIndex = idx - ringStart;
    const ringCount = Math.max(10, (ring * 8) + 10);
    const angle = (Math.PI * 2 * ringIndex / ringCount) + (ring * 0.10);
    const radius = 110 + (ring * step);
    const jitter = ((idx % 7) - 3) * 4;
    map.set(node.id, {x:(radius + jitter) * Math.cos(angle), y:(radius + jitter) * Math.sin(angle)});
  });
  return map;
}

let curFilter='all',curSearch='';
function buildData(ft,st){
  let f=allNodes;
  if(ft&&ft!=='all')f=f.filter(n=>normType(n.type)===ft);
  if(st){const q=st.toLowerCase();f=f.filter(n=>String(n.id).toLowerCase().includes(q));}
  const ids=new Set(f.map(n=>n.id));
  const fe=allEdges.filter(e=>ids.has(e.source)&&ids.has(e.target));
  const positions = buildPositions(f);
  return{nodes:f.map(n=>({id:n.id,name:n.id.length>16?n.id.slice(0,15)+'…':n.id,value:n,x:positions.get(n.id).x,y:positions.get(n.id).y,symbolSize:Math.min(40,Math.max(16,Math.sqrt(n.relations||1)*6)),category:normType(n.type),itemStyle:{color:typeColor[normType(n.type)],shadowBlur:12,shadowColor:typeGlow[normType(n.type)],borderColor:'rgba(255,255,255,0.15)',borderWidth:1.5},label:{show:true,fontSize:9,color:'#e2e8f0'}}))),links:fe.map(e=>({source:e.source,target:e.target,value:e,lineStyle:{color:'rgba(99,102,241,0.1)',width:1,curveness:0.15}}))),categories:[{name:'table'},{name:'view'},{name:'proc'},{name:'other'}]};
}
const chart=echarts.init(document.getElementById('graph'),null,{renderer:'canvas'});
function render(){
  const d=buildData(curFilter,curSearch);
  chart.setOption({
    backgroundColor:'transparent',
    animationDurationUpdate:300,
    tooltip:{formatter:function(p){
      if(p.dataType==='node'){const n=p.data.value||{};const cols=(n.columns||[]).length;const rels=(n.incoming||[]).length+(n.outgoing||[]).length;return'<div style="font-size:12px;max-width:280px"><b style="color:'+typeColor[normType(n.type)]+'">'+n.id+'</b><br><span style="color:#94a3b8">Type: '+normType(n.type)+'</span><br><span style="color:#94a3b8">Columns: '+cols+'</span><br><span style="color:#94a3b8">Relations: '+rels+'</span>'+(n.summary?'<br><span style="color:#64748b;font-size:10px">'+String(n.summary).slice(0,120)+'…</span>':'')+'</div>';}
      if(p.dataType==='edge'){return'<div style="font-size:11px">'+((p.data.value||{}).label||'')+'</div>';}
    }},
    series:[{
      type:'graph',
      layout:'none',
      roam:true,
      draggable:true,
      data:d.nodes,
      links:d.links,
      categories:d.categories,
      edgeSymbol:['none','arrow'],
      edgeSymbolSize:[3,8],
      labelLayout:{hideOverlap:true,moveOverlap:'shiftY'},
      emphasis:{focus:'adjacency',itemStyle:{shadowBlur:25,borderWidth:3},lineStyle:{color:'rgba(6,182,212,0.5)',width:2},label:{show:true}},
      lineStyle:{color:'rgba(99,102,241,0.1)',width:1,curveness:0.15},
      label:{show:true,fontSize:9,color:'#e2e8f0'},
      scaleLimit:{min:0.3,max:4}
    }]
  },true);
}
chart.on('click',function(p){if(p.dataType==='node'&&p.data&&p.data.value)showIns(p.data.value);});
const insp=document.getElementById('insp'),iBody=document.getElementById('iBody'),iTitle=document.getElementById('iTitle'),iClose=document.getElementById('iClose');
function showIns(n){
  const t=normType(n.type),cols=n.columns||[],inc=n.incoming||[],out=n.outgoing||[];
  let ch='';
  if(cols.length){ch='<div class="cg">'+cols.map(function(c){const p=String(c).split(/\s+/);return'<span class="cn">'+(p[0]||c)+'</span><span class="ct">'+(p.slice(1).join(' ')||'')+'</span>';}).join('')+'</div>';}
  let rh='';
  if(out.length)rh+=out.map(function(r){return'<div class="ri"><span class="rt">'+(r.type||'→')+'</span> '+r.from+' → '+r.to+(r.text?'<br><span style="color:var(--muted);font-size:10px">'+r.text+'</span>':'')+'</div>';}).join('');
  if(inc.length)rh+=inc.map(function(r){return'<div class="ri"><span class="rt">'+(r.type||'←')+'</span> '+r.from+' → '+r.to+'</div>';}).join('');
  iTitle.textContent=n.id;
  iBody.innerHTML='<div class="is"><div class="il">Type</div><div class="iv"><span class="bg '+t+'">'+t+'</span></div></div>'+(n.row_count?'<div class="is"><div class="il">Row Count</div><div class="iv">'+Number(n.row_count).toLocaleString()+'</div></div>':'')+(n.last_update?'<div class="is"><div class="il">Last Update</div><div class="iv">'+n.last_update+'</div></div>':'')+(n.pk&&n.pk.length?'<div class="is"><div class="il">Primary Key</div><div class="iv"><code>'+n.pk.join(', ')+'</code></div></div>':'')+(cols.length?'<div class="is"><div class="il">Columns ('+cols.length+')</div>'+ch+'</div>':'')+((inc.length+out.length)?'<div class="is"><div class="il">Dependencies ('+(inc.length+out.length)+')</div><div class="rl">'+rh+'</div></div>':'')+(n.summary?'<div class="is"><div class="il">Summary</div><div class="iv" style="font-size:12px;color:var(--muted);line-height:1.6">'+String(n.summary).slice(0,400)+'…</div></div>':'');
  insp.classList.add('open');
}
function resetIns(){insp.classList.remove('open');}
iClose.addEventListener('click',resetIns);
chart.getZr().on('click',function(e){if(e.target===chart.getZr())resetIns();});
document.getElementById('search').addEventListener('input',function(e){curSearch=e.target.value.trim();render();});
document.querySelectorAll('.fbtn').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.fbtn').forEach(function(x){x.classList.remove('on');});this.classList.add('on');curFilter=this.dataset.f;render();});});

document.getElementById('fBar').innerHTML='<span><b>'+allEdges.length+'</b> dependency edges across <b>'+allNodes.length+'</b> objects</span><span style="margin-left:auto;color:var(--muted)">Click any node · Scroll to zoom · Drag to pan</span>';
render();
window.addEventListener('resize',function(){chart.resize();});
